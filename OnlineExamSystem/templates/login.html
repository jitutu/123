<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 网上阅卷系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="login-title">校内智能网上阅卷系统</h1>
    <p class="login-sub">答题卡数字化 · 自动识别 · 在线阅卷 · 成绩统计</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" class="login-form">
      <label>账号
        <input type="text" name="username" placeholder="请输入账号" required autofocus>
      </label>
      <label>密码
        <input type="password" name="password" placeholder="请输入密码" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="login-tip">默认账号：管理员 admin / 教师 teacher1 / 学生 001，密码均为 123456</p>
  </div>
</body>
</html>
